# Render Blueprint for the FastAPI backend.
# Use this only when creating the service as a "Blueprint"; an existing manual
# service can keep its dashboard settings (Root Directory = backend,
# Start Command = uvicorn server:app --host 0.0.0.0 --port $PORT).
services:
  - type: web
    name: swachh-chiplun-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Python 3.12 has wheels for every pinned dependency (3.13 does not for some).
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DB_NAME
        value: swachh_chiplun
      - key: MONGO_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PROXY_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSCODE
        sync: false
